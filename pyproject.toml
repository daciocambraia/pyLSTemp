[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylstemp"
version = "1.11.0"
description = "Professional Python library for land surface temperature workflows from Landsat imagery."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
  { name = "Original library by Oladimeji Mudele" },
  { name = "pyLSTemp maintainers" }
]
keywords = ["landsat", "remote-sensing", "temperature", "emissivity", "ndvi"]
dependencies = ["numpy>=1.24"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5.0"]
examples = ["rasterio>=1.3", "pillow>=10"]

[tool.setuptools.packages.find]
include = ["pylstemp*"]

[project.urls]
Homepage = "https://github.com/daciocambraia/pyLSTemp"
Repository = "https://github.com/daciocambraia/pyLSTemp"
Issues = "https://github.com/daciocambraia/pyLSTemp/issues"
Documentation = "https://github.com/daciocambraia/pyLSTemp/tree/main/docs"

[tool.setuptools.package-data]
pylstemp = ["method_cards.json"]
