name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.14"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install built wheel
        run: >-
          python -c "import glob,subprocess,sys;
          subprocess.check_call([sys.executable,'-m','pip','install',*glob.glob('dist/*.whl')])"
      - name: Check installed public imports
        run: >-
          python -I -c "import pylstemp; from pylstemp.scene import LandsatScene;
          from pylstemp.workflows import du_from_scene, scene_ndvi_range;
          print(pylstemp.__version__); print(pylstemp.list_algorithms())"
