name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.14"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and example dependencies
        run: python -m pip install -e ".[dev,examples]"
      - name: Run numerical, calibration, IO and documentation tests
        run: python -m pytest --cov=pylstemp --cov-branch --cov-report=term-missing
      - name: Build distributions
        run: python -m build
