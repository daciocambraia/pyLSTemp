name: Publish Package

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Check release tag matches package version
        run: >-
          python -c "import os,tomllib; from packaging.version import Version;
          meta=tomllib.load(open('pyproject.toml','rb'));
          assert Version(os.environ['GITHUB_REF_NAME'].removeprefix('v')) == Version(meta['project']['version']), 'Release tag must match pyproject.toml version'"

      - name: Build package
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Install built wheel
        run: >-
          python -c "import glob,subprocess,sys;
          subprocess.check_call([sys.executable,'-m','pip','install',*glob.glob('dist/*.whl')])"

      - name: Check installed public imports
        run: >-
          python -I -c "import pylstemp; from pylstemp.scene import LandsatScene;
          from pylstemp.workflows import du_from_scene;
          print(pylstemp.__version__); print(pylstemp.list_algorithms())"

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
